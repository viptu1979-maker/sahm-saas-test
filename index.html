const lineNet=(it,rate)=>{const r=(rate??cfg().vatRate)/100,g=(+it.qty||0)*(+it.price||0)-(+it.disc||0);return r2(it.incl?g/(1+r):g)};
const unitEx=(it,rate)=>{const r=(rate??cfg().vatRate)/100;return it.incl?(+it.price||0)/(1+r):(+it.price||0)};
function totals(d){const rate=(d.vatRate??cfg().vatRate)/100;let ex=0,inc=0,gx=0,dx=0;(d.items||[]).forEach(it=>{const g=(+it.qty||0)*(+it.price||0),ds=(+it.disc||0);if(it.incl){inc+=g-ds;gx+=g/(1+rate);dx+=ds/(1+rate)}else{ex+=g-ds;gx+=g;dx+=ds}});if(!inc){const net=r2(ex),vat=r2(net*rate);return{gross:r2(gx),disc:r2(dx),net,vat,total:r2(net+vat)}}const total=r2(ex*(1+rate)+inc),net=r2(ex+inc/(1+rate));return{gross:r2(gx),disc:r2(dx),net,vat:r2(total-net),total}}
const paid=d=>r2(sum(d.payments||[],p=>p.amount));
const due=d=>d.status==='void'?0:r2(totals(d).total-paid(d));
function invSt(d){if(d.status==='void')return['ملغاة','void'];const t=totals(d).total,p=paid(d);if(t>0&&p>=t-.005)return['مدفوعة','ok'];if(d.due&&d.due<today())return[p>0?'متأخرة · جزئي':'متأخرة','bad'];return[p>0?'مدفوعة جزئيًا':'غير مدفوعة','warn']}
const QST={draft:'مسودة',sent:'مُرسَل',accepted:'مقبول',rejected:'مرفوض',converted:'حُوِّل لفاتورة'};
function quoSt(d){if(d.status==='converted')return[QST.converted,'ok'];if(d.status==='accepted')return[QST.accepted,'ok'];if(d.status==='rejected')return[QST.rejected,'void'];if(d.valid&&d.valid<today())return['منتهي الصلاحية','bad'];return[QST[d.status]||'مسودة','warn']}
function stock(){const m={};list('products').forEach(p=>{if(p.type!=='service')m[p.id]=+p.open||0});
  const mv=(col,sg)=>list(col).forEach(d=>d.status!=='void'&&(d.items||[]).forEach(it=>{if(it.pid in m)m[it.pid]+=sg*(+it.qty||0)}));
  mv('purchases',1);mv('invoices',-1);list('adjustments').forEach(a=>{if(a.pid in m)m[a.pid]+=+a.qty||0});return m}
function nextNo(col,pre){let mx=0;list(col).forEach(d=>{const m=String(d.no||'').match(/(\d+)\s*$/);if(m)mx=Math.max(mx,+m[1])});return pre+String(mx+1).padStart(4,'0')}
function partyOf(col,d){const pc=col==='purchases'?'suppliers':'customers';const live=S[pc][d.partyId];return live||d.party||{name:col==='purchases'?'—':'عميل نقدي'}}

function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function dbErr(e){const c=e&&e.code;return /permission/.test(c)?'لا تملك صلاحية لهذا الإجراء':/quota/.test(c)?'تجاوزت حصة قاعدة البيانات':/resource/.test(c)?'طلبات كثيرة، أعد المحاولة بعد لحظات':'تعذّر الحفظ، تحقق من الاتصال وأعد المحاولة'}
async function put(col,id,data,quiet){if(EXP()){toast('الاشتراك منتهٍ — الحساب للقراءة فقط',1);throw{code:'expired'}}const body=JSON.parse(JSON.stringify(data));delete body.id;if(ME){body.updatedAt=new Date().toISOString();body.updatedBy=ME.email}
  if(!db){if(col==='settings')S.settings=body;else S[col][id]={...body,id};persist();schedule();return}
  if(!navigator.onLine){db.doc(TP()+col+'/'+id).set(body).catch(e=>toast(dbErr(e),1));return}
  for(let a=0;;a++){try{await db.doc(TP()+col+'/'+id).set(body);return}catch(e){const c=e&&e.code;if(a<3&&/unavailable|resource/.test(c||'')){await new Promise(r=>setTimeout(r,(/resource/.test(c)?1500:500)*(a+1)+Math.random()*400));continue}if(!quiet)toast(dbErr(e),1);throw e}}}
async function del(col,id){if(!db){delete S[col][id];persist();schedule();return}
  if(EXP()){toast('الاشتراك منتهٍ — الحساب للقراءة فقط',1);throw{code:'expired'}}try{await db.doc(TP()+col+'/'+id).delete()}catch(e){toast(dbErr(e),1);throw e}}

function startData(){const timer=setTimeout(()=>{if(mode==='loading')banner('تعذّر الوصول إلى البيانات حتى الآن. تحقق من الاتصال بالإنترنت.')},10000);

  let f0=0,f1=0;unsubs.push(db.doc('tenants/'+T).onSnapshot({includeMetadataChanges:true},s=>{TEN=s.exists?{...s.data(),id:s.id}:null;if(!f1&&!s.metadata.fromCache){f1=1;ready()}applyRole();schedule()},onErr));unsubs.push(db.doc('platform/main').onSnapshot(s=>{PLAT=s.exists?s.data():{};schedule()},()=>{}));
  unsubs.push(db.doc(TP()+'seats/main').onSnapshot(s=>{SEATS=s.exists?s.data():null;schedule()},()=>{}));
  unsubs.push(db.doc(TP()+'settings/main').onSnapshot({includeMetadataChanges:true},s=>{S.settings=s.exists?{...s.data()}:{};if(!f0&&!s.metadata.fromCache){f0=1;ready()}schedule()},onErr));
  COLS.forEach(c=>{let f=0;unsubs.push(db.collection(TP()+c).onSnapshot({includeMetadataChanges:true},q=>{const o={};q.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});S[c]=o;if(!f&&!q.metadata.fromCache){f=1;ready()}schedule()},onErr))});
  if(ROLE==='admin')unsubs.push(db.collection('users').where('tenant','==',T).onSnapshot(q=>{USERS={};q.docs.forEach(d=>USERS[d.id]={...d.data(),id:d.id});schedule()},()=>{}));
  if(SUPER()){unsubs.push(db.collection('tenants').onSnapshot({includeMetadataChanges:true},q=>{TENS={};q.docs.forEach(d=>TENS[d.id]={...d.data(),id:d.id});if(!q.metadata.fromCache)Object.defineProperty(TENS,'__ok',{value:1});syncSeats();schedule()},()=>{}));unsubs.push(db.collection('users').onSnapshot({includeMetadataChanges:true},q=>{ALLU={};q.docs.forEach(d=>ALLU[d.id]={...d.data(),id:d.id});if(!q.metadata.fromCache)Object.defineProperty(ALLU,'__ok',{value:1});syncSeats();schedule()},()=>{}))}
  bump()}

function vReports(){const c=cfg(),from=U.from,to=U.to,inR=x=>x>=from&&x<=to,t=today();
  const inv=list('invoices').filter(d=>d.status!=='void'&&!d.opening&&inR(d.date||'')),pur=list('purchases').filter(d=>d.status!=='void'&&!d.opening&&inR(d.date||'')),exp=list('expenses').filter(e=>inR(e.date||''));
  const rev=sum(inv,d=>totals(d).net),vOut=sum(inv,d=>totals(d).vat);
  const cogs=sum(inv,d=>sum(d.items||[],it=>{const p=S.products[it.pid];if(!p||p.type==='service')return 0;return(+it.qty||0)*(+(it.cost??p.cost)||0)}));
  const eNet=sum(exp,e=>e.amount),eVat=sum(exp,e=>e.vat),pNet=sum(pur,d=>totals(d).net),pVat=sum(pur,d=>totals(d).vat);
  const gp=rev-cogs,np=gp-eNet,vNet=vOut-pVat-eVat;

  const ag=[0,0,0,0,0];list('invoices').forEach(d=>{const r=due(d);if(r<=.005)return;const days=dBetween(d.due||d.date,t);ag[days<=0?0:days<=30?1:days<=60?2:days<=90?3:4]+=r});
  const tp={};inv.forEach(d=>(d.items||[]).forEach(it=>{const k=it.name||'—';tp[k]=tp[k]||{q:0,v:0};tp[k].q+=+it.qty||0;tp[k].v+=lineNet(it,d.vatRate)}));const top=Object.entries(tp).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  const L=(l,v,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="num"><bdi dir="ltr">${fmt(v)}</bdi></td></tr>`;
  return`<div class="top"><div><h1>صافي الربح: <bdi dir="ltr">${fmt(np)}</bdi> ${esc(c.cur)}</h1><p class="sub">من ${from} إلى ${to} · ضريبة مستحقة للسداد <bdi dir="ltr">${fmt(vNet)}</bdi></p></div></div>
  <div class="bar"><label style="display:flex;gap:8px;align-items:center">من<input type="date" id="r-from" data-u="from" value="${from}" style="width:auto"></label><label style="display:flex;gap:8px;align-items:center">إلى<input type="date" id="r-to" data-u="to" value="${to}" style="width:auto"></label><div class="seg"><button data-act="preset" data-p="m">هذا الشهر</button><button data-act="preset" data-p="pm">الشهر السابق</button><button data-act="preset" data-p="q">هذا الربع</button><button data-act="preset" data-p="y">هذه السنة</button></div></div>
  <div class="grid2"><div class="panel"><h3>قائمة الدخل</h3><table class="pl">${L('صافي المبيعات',rev)}${L('تكلفة البضاعة المباعة',-cogs)}${L('مجمل الربح',gp,'sep')}${Object.entries(cats).map(([k,v])=>L('مصروف: '+esc(k),-v)).join('')}${L('صافي الربح',np,'sep')}</table><p class="hint">التكلفة محسوبة بسعر تكلفة الصنف وقت إصدار الفاتورة.</p></div>
  <div class="panel"><h3>إقرار ضريبة القيمة المضافة</h3><table class="pl"><tr><td>المبيعات الخاضعة للضريبة</td><td class="num">${fmt(rev)}</td></tr>${L('ضريبة المخرجات',vOut)}<tr><td>المشتريات الخاضعة للضريبة</td><td class="num">${fmt(pNet)}</td></tr>${L('ضريبة مدخلات المشتريات',-pVat)}<tr><td>المصروفات الخاضعة للضريبة</td><td class="num">${fmt(eNet)}</td></tr>${L('ضريبة مدخلات المصروفات',-eVat)}${L(vNet>=0?'صافي الضريبة المستحقة':'رصيد ضريبي لصالحك',vNet,'sep')}</table><p class="hint">للمراجعة قبل تقديم الإقرار على بوابة هيئة الزكاة والضريبة والجمارك.</p></div></div>
  <div class="grid2 mt"><div class="panel"><h3>أعمار ذمم العملاء (حتى اليوم)</h3><table class="pl">${L('غير مستحقة بعد',ag[0])}${L('متأخرة 1–30 يومًا',ag[1])}${L('31–60 يومًا',ag[2])}${L('61–90 يومًا',ag[3])}${L('أكثر من 90 يومًا',ag[4])}${L('الإجمالي',sum(ag,x=>x),'sep')}</table></div>

function prodStats(pid){const p=S.products[pid],mv=[],hist=[];let inQ=+p.open||0,outQ=0;if(+p.open)mv.push({date:S.settings.openDate||'',type:'افتتاحي',desc:'رصيد افتتاحي',q:+p.open});
  list('purchases').forEach(d=>{if(d.status==='void')return;(d.items||[]).forEach(it=>{if(it.pid!==pid)return;const q=+it.qty||0,u=q?lineNet(it,d.vatRate)/q:unitEx(it,d.vatRate),sp=partyOf('purchases',d);inQ+=q;mv.push({date:d.date,type:'شراء',desc:d.no+' · '+sp.name,q,u,ref:['purchases',d.id]});hist.push({date:d.date,no:d.no,id:d.id,sup:sp.name,sid:d.partyId||sp.name,q,u})})});
  list('invoices').forEach(d=>{if(d.status==='void')return;(d.items||[]).forEach(it=>{if(it.pid!==pid)return;const q=+it.qty||0;outQ+=q;mv.push({date:d.date,type:'بيع',desc:d.no+' · '+partyOf('invoices',d).name,q:-q,u:q?lineNet(it,d.vatRate)/q:0,ref:['invoices',d.id]})})});
  list('adjustments').forEach(a=>{if(a.pid!==pid)return;const q=+a.qty||0;if(q>0)inQ+=q;else outQ-=q;mv.push({date:a.date,type:'تسوية',desc:a.reason||'',q})});
  mv.sort((a,b)=>(a.date||'').localeCompare(b.date||''));hist.sort((a,b)=>(a.date||'').localeCompare(b.date||''));return{p,mv,hist,inQ,outQ}}
function openProduct(pid){const {p,mv,hist,inQ,outQ}=prodStats(pid),c=cfg(),svc=p.type==='service',bal=inQ-outQ,last=hist.at(-1),avg=sum(hist,h=>h.q)?sum(hist,h=>h.q*h.u)/sum(hist,h=>h.q):0;
  const sups={};hist.forEach(h=>{const s=sups[h.sid]=sups[h.sid]||{n:h.sup,min:Infinity,max:0,q:0,c:0,last:null};s.min=Math.min(s.min,h.u);s.max=Math.max(s.max,h.u);s.q+=h.q;s.c++;s.last=h});
  let prev=null;const hrows=hist.map(h=>{const ch=prev?((h.u-prev)/prev*100):null;prev=h.u;return`<tr class="click" data-act="viewDoc" data-col="purchases" data-id="${h.id}"><td>${esc(h.date)}</td><td>${esc(h.sup)}</td><td>${esc(h.no)}</td><td class="num">${qf(h.q)}</td><td class="num">${fmt(h.u)}</td><td class="num">${ch===null||!isFinite(ch)?'—':`<span class="${ch>0?'up':ch<0?'down':''}">${ch>0?'▲':ch<0?'▼':''} ${Math.abs(ch).toFixed(1)}%</span>`}</td></tr>`}).reverse();
  let run=0;const mrows=mv.map(m=>{run+=m.q;return`<tr ${m.ref?`class="click" data-act="viewDoc" data-col="${m.ref[0]}" data-id="${m.ref[1]}"`:''}><td>${esc(m.date||'—')}</td><td>${m.type}</td><td>${esc(m.desc)}</td><td class="num">${m.q>0?qf(m.q):''}</td><td class="num">${m.q<0?qf(-m.q):''}</td><td class="num">${qf(run)}</td></tr>`}).reverse();
  modal(`${mh(esc(p.name))}<div class="bar"><span class="chip">${esc(p.code||'بدون رقم')}</span>${svc?'<span class="chip">خدمة</span>':`<span class="chip">${esc(p.unit||'')}</span>`}<button class="btn sm" data-act="edit" data-col="products" data-id="${pid}">تعديل</button>${p.code?`<button class="btn sm ghost" data-act="labels" data-id="${pid}">طباعة باركود</button>`:''}${svc?'':`<button class="btn sm ghost" data-act="adj" data-id="${pid}">تسوية مخزون</button>`}</div>
  <div class="kps">${kpi('سعر البيع شامل الضريبة',fmt(priceIn(p)),'قبل الضريبة '+fmt(priceIn(p)/(1+c.vatRate/100)))}${kpi('سعر التكلفة الحالي',fmt(p.cost))}${kpi('آخر سعر شراء',last?fmt(last.u):'—',last?esc(last.date+' · '+last.sup):'')}${kpi('متوسط سعر الشراء',avg?fmt(avg):'—',hist.length?hist.length+' عملية شراء':'')}
  ${svc?'':kpi('الوارد',qf(inQ),'افتتاحي + مشتريات + تسويات')+kpi('الصادر',qf(outQ),'مبيعات + تسويات')+kpi('الرصيد الحالي',qf(bal)+' '+esc(p.unit||''),'القيمة '+fmt(Math.max(bal,0)*(+p.cost||0)))}</div>

  ${hist.length?`<h3 class="mt">تاريخ أسعار الشراء</h3>${tbl([['التاريخ'],['المورد'],['الفاتورة'],['الكمية','num'],['سعر الوحدة','num'],['التغير','num']],hrows)}`:'<p class="hint mt">لا توجد مشتريات مسجلة لهذا الصنف بعد.</p>'}
  ${mv.length?`<h3 class="mt">حركة الصنف</h3>${tbl([['التاريخ'],['النوع'],['البيان'],['وارد','num'],['صادر','num'],['الرصيد','num']],mrows)}`:''}<p class="hint">أسعار الشراء قبل الضريبة وبعد الخصم.</p>`,true)}

  else if(t==='inv')body=tbl([['الرقم'],['التاريخ'],['الإجمالي','num'],['المدفوع','num'],['المتبقي','num'],['الحالة']],docs.map(d=>`<tr class="click" data-act="viewDoc" data-col="${dc}" data-id="${d.id}"><td><b>${esc(d.no)}</b></td><td>${esc(d.date)}</td><td class="num">${fmt(totals(d).total)}</td><td class="num">${fmt(paid(d))}</td><td class="num">${fmt(due(d))}</td><td>${chip(invSt(d))}</td></tr>`))||'<p class="empty">لا توجد فواتير.</p>';

  else if(t==='ct')body=tbl([['الرقم'],['العقد'],['من'],['إلى'],['القيمة','num'],['الحالة']],list('contracts').filter(c=>c.partyId===id).sort((a,b)=>(b.start||'').localeCompare(a.start||'')).map(c=>`<tr class="click" data-act="editCt" data-id="${c.id}"><td><b>${esc(c.no)}</b></td><td>${esc(c.title||'')}</td><td>${esc(c.start||'')}</td><td>${esc(c.end||'')}</td><td class="num">${fmt(c.value)}</td><td>${chip(ctSt(c))}</td></tr>`))||'<p class="empty">لا توجد عقود صيانة.</p>';
  else if(t==='tk')body=tbl([['الرقم'],['الموعد'],['النوع'],['الفني'],['الحالة']],list('tickets').filter(k=>k.partyId===id).sort(byDate).map(k=>`<tr class="click" data-act="editTk" data-id="${k.id}"><td><b>${esc(k.no)}</b></td><td>${esc(k.date||'')} ${esc(k.time||'')}</td><td>${TKT[k.type]||''}</td><td>${esc(k.tech||'')}</td><td>${chip(TST[k.status]||TST.new)}</td></tr>`))||'<p class="empty">لا توجد زيارات.</p>';
  else if(t==='items'){const m={};list('purchases').filter(d=>d.partyId===id&&d.status!=='void').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(d=>(d.items||[]).forEach(it=>{const k=it.pid||it.name;const r=m[k]=m[k]||{n:it.name,pid:it.pid,q:0,u:0,d:''};r.q+=+it.qty||0;r.u=(+it.qty?lineNet(it,d.vatRate)/(+it.qty):0);r.d=d.date}));
    body=tbl([['الصنف'],['الكمية','num'],['آخر سعر','num'],['آخر شراء']],Object.values(m).sort((a,b)=>b.d.localeCompare(a.d)).map(r=>`<tr ${r.pid&&S.products[r.pid]?`class="click" data-act="prod" data-id="${r.pid}"`:''}><td>${esc(r.n)}</td><td class="num">${qf(r.q)}</td><td class="num">${fmt(r.u)}</td><td>${esc(r.d)}</td></tr>`))||'<p class="empty">لا توجد مشتريات.</p>'}

/* ---------- الصيانة والعقود والمواعيد ---------- */
const TKT={emergency:'صيانة طارئة',periodic:'زيارة دورية',install:'تركيب',inspect:'فحص / معاينة',other:'أخرى'};
const TST={new:['جديد','warn'],scheduled:['مجدول','info'],done:['منجز','ok'],cancelled:['ملغى','void']};
const BILL={yearly:['سنوي',1],semi:['نصف سنوي',2],quarterly:['ربع سنوي',4],monthly:['شهري',12],once:['دفعة واحدة',1]};
const DEF_TERMS=`يلتزم الطرف الأول بإجراء زيارات الصيانة الوقائية الدورية لأنظمة المراقبة المذكورة في هذا العقد وفق عدد الزيارات المتفق عليه.
تشمل الصيانة فحص الكاميرات وأجهزة التسجيل وتنظيفها وضبط زوايا الرؤية والتأكد من سلامة التسجيل والتوصيلات وتحديث البرامج عند الحاجة.
يلتزم الطرف الأول بالاستجابة لبلاغات الأعطال الطارئة خلال 24 ساعة عمل من وقت البلاغ.
لا تشمل قيمة العقد قطع الغيار والأجهزة البديلة، وتُحتسب بعد موافقة الطرف الثاني عليها.
لا يشمل العقد الأعطال الناتجة عن سوء الاستخدام أو الكوارث الطبيعية أو التعديل على الأنظمة من غير الطرف الأول.
يلتزم الطرف الثاني بسداد قيمة العقد وفق طريقة الدفع المحددة، وتمكين فني الطرف الأول من الوصول إلى مواقع الأجهزة.
يُجدَّد العقد باتفاق الطرفين كتابيًا قبل انتهائه.

  let m=inp.nextElementSibling?.classList?.contains('pf-n')?inp.nextElementSibling:null;if(!m){m=document.createElement('div');m.className='pf-n hint';inp.after(m)}m.textContent=q.trim()?(hits.length?(hits.length===1?'✓ '+hits[0].textContent:hits.length+' نتيجة — اختر من القائمة'):'لا يوجد عميل مطابق'):''}

const POS_OK=new Set(['posSel','posMode','posNum','posCust','posSetC','posDiscAll','posDiscOk','go','posCat','posFocus','posPad','padKey','padOk','install','devSave','posAdd','posQ','posDel','posPay','posConfirm','posHold','posHeld','posResume','posHeldDel','posClear','posZ','posZPrint','payM','payQ','printRec','close','logout','back']);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,f=ACT[a];if(!f)return;e.preventDefault();if(ROLE==='cashier'&&!POS_OK.has(a)){toast('غير متاح لصلاحية الكاشير',1);return}if(EXP()&&(W_ACT.has(a)||A_ACT.has(a))){toast('الاشتراك منتهٍ — الحساب للقراءة فقط',1);return}
  if(A_ACT.has(a)&&ROLE!=='admin'){toast('هذا الإجراء للمدير فقط',1);return}if(W_ACT.has(a)&&ROLE==='viewer'){toast('صلاحيتك عرض فقط',1);return}f(b.dataset,b)});
$('#view').addEventListener('input',e=>{const k=e.target.dataset.u;if(k){U[k]=e.target.value;schedule()}});
$('#view').addEventListener('submit',async e=>{if(e.target.id!=='setf')return;e.preventDefault();const f=new FormData(e.target),o={...S.settings};for(const[k,v]of f.entries())o[k]=['vatRate','payDays','quoteDays'].includes(k)?(+v||0):String(v).trim();
  if(o.vat&&!/^3\d{13}3$/.test(o.vat))toast('تنبيه: الرقم الضريبي السعودي 15 رقمًا يبدأ وينتهي بـ 3');try{await put('settings','main',o);setTimeout(()=>toast('حُفظت الإعدادات'),o.vat&&!/^3\d{13}3$/.test(o.vat)?2700:0);document.activeElement.blur();schedule()}catch(_){}});
$('#view').addEventListener('change',e=>{const t=e.target;if(t.dataset.urole){db.doc('users/'+t.dataset.urole).update({role:t.value}).then(()=>toast('تم تغيير الصلاحية')).catch(err=>toast(fbErr(err),1));return}if(t.id==='im-file'){t.files[0]&&imFile(t.files[0]);t.value='';return}if(t.id==='logo-in'){setLogo(t.files[0]);t.value='';return}if(t.id==='im-sheet'){imSheet(t.value);return}if(t.dataset.im){IM.map[t.dataset.im]=+t.value;schedule();return}if(t.dataset.imd){IM.date=t.value;return}if(e.target.id!=='imp')return;const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(_){toast('الملف غير صالح',1);return}
  const n=COLS.reduce((s,c)=>s+Object.keys(o[c]||{}).length,0);ask(`سيُستورد ${n} سجلًا${o.settings?' مع الإعدادات':''}. متابعة؟`,async()=>{let i=0;try{if(o.settings&&Object.keys(o.settings).length)await put('settings','main',o.settings);for(const c of COLS)for(const[id,v]of Object.entries(o[c]||{})){await put(c,id,v);if(++i%20===0)toast(`جارٍ الاستيراد… ${i} / ${n}`)}toast('اكتمل الاستيراد: '+i+' سجل')}catch(_){}},'استيراد')};rd.readAsText(file);e.target.value=''});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ask').hidden){$('#ask').hidden=true}});

route();init();
}
</script>
